# Models and routes are added through the Admin UI and stored in PostgreSQL.
model_list: []

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  num_retries: 2
  timeout: 120

litellm_settings:
  callbacks: [prometheus]
  # Redis shares routing state; completion caching remains opt-in.
  cache: false
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
